name: Build macOS

# Builds the macOS .dmg on GitHub's Mac machines (Apple Silicon + Intel).
# Every push: the .dmg files and a screenshot of the running app are attached to the run (Actions tab > run > Artifacts).
# Pushing a tag like v1.0.0: the .dmg files are also published on the Releases page.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest       # Apple Silicon (M1/M2/M3/M4)
            arch: arm64
          - runner: macos-15-intel     # Intel Macs
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"; else echo "VERSION=1.0.0" >> "$GITHUB_ENV"; fi

      - name: Build .dmg
        run: |
          chmod +x build-mac.sh
          ./build-mac.sh
          mv build/EasyNotes92-*.dmg "build/EasyNotes92-${VERSION}-macos-${{ matrix.arch }}.dmg"

      - name: Smoke test (start the app, take a screenshot)
        run: |
          CP="build/classes:lib/flatlaf-3.7.1.jar:lib/flatlaf-intellij-themes-3.7.1.jar"
          mkdir -p smoke
          java -Deasynotes.dir="$PWD/smoke/settings" -cp "$CP" com.esisa.notepad.Main > smoke/log.txt 2>&1 &
          APP=$!
          sleep 20
          screencapture -x "smoke/screenshot-${{ matrix.arch }}.png" || echo "screencapture not allowed on this runner"
          if kill -0 $APP 2>/dev/null; then echo "App is running"; kill $APP; else echo "App exited early:"; cat smoke/log.txt; exit 1; fi
          cat smoke/log.txt

      - name: Save the screenshot on the "screenshots" branch
        if: github.ref == 'refs/heads/main'
        run: |
          [ -f "smoke/screenshot-${{ matrix.arch }}.png" ] || exit 0
          cp "smoke/screenshot-${{ matrix.arch }}.png" /tmp/shot.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for try in 1 2 3; do
            git fetch origin screenshots 2>/dev/null && git checkout -B screenshots origin/screenshots || git checkout --orphan screenshots
            git rm -rfq --cached . >/dev/null 2>&1 || true
            cp /tmp/shot.png "screenshot-${{ matrix.arch }}.png"
            git add "screenshot-${{ matrix.arch }}.png"
            git commit -qm "CI screenshot (${{ matrix.arch }})" && git push origin screenshots && break
            sleep 5
          done

      - uses: actions/upload-artifact@v4
        with:
          name: EasyNotes92-macos-${{ matrix.arch }}
          path: |
            build/EasyNotes92-*.dmg
            smoke/*.png
            smoke/log.txt

      - name: Publish on the Releases page (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/EasyNotes92-*.dmg
